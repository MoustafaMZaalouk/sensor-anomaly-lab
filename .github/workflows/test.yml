      - name: Install exact tested dependencies
        run: pip install -r requirements.txt
      - name: Run all four tests
        run: python -m unittest -v
      - name: Run experiment
        run: python demo.py
      - name: Commit initialized source only when not yet present
        run: |
          if ! git ls-files --error-unmatch demo.py >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md demo.py test_demo.py requirements.txt results.json results.png verification.txt LICENSE .gitignore
            git commit -m 'Bootstrap tested AI-assisted educational source and recorded results'
            git push
          fi
